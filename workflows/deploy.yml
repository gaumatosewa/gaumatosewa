# =============================================================================
# GitHub Actions: Auto-Deploy gaumatosewa to Cloudflare Pages Production
# 
# 🎯 Every push to 'main' → Automatic production deployment
# 👀 Pull requests → Preview deployments
#
# Project: GreenEarth Organics (gaumatosewa)
# Type: Cloudflare Pages (Static Site, Zero Build Step)
# =============================================================================

name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # Manual trigger from GitHub UI

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ===========================================================================
  # JOB 1: Deploy to PRODUCTION (main branch only)
  # ===========================================================================
  deploy-production:
    name: ☁️ Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js (for Wrangler CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Wrangler CLI
        run: npm install -g wrangler

      - name: ✅ Verify Wrangler Installation
        run: wrangler --version

      - name: 🌐 Deploy to Cloudflare Pages (Production)
        id: deploy
        run: |
          wrangler pages deploy . \
            --project-name=gaumatosewa \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: ✅ Deployment Summary
        run: |
          echo "## 🎉 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | gaumatosewa |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | main |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 What was deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Static HTML/CSS/JS files" >> $GITHUB_STEP_SUMMARY
          echo "- 15 product listings with images" >> $GITHUB_STEP_SUMMARY
          echo "- Cloudflare Pages Functions (/api/config)" >> $GITHUB_STEP_SUMMARY
          echo "- Environment variables from wrangler.toml" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 2: Preview Deployment (Pull Requests)
  # ===========================================================================
  deploy-preview:
    name: 👀 Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    environment:
      name: preview
      url: ${{ steps.deploy-preview.outputs.preview_url }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js (for Wrangler CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Wrangler CLI
        run: npm install -g wrangler

      - name: 🌐 Deploy Preview to Cloudflare Pages
        id: deploy-preview
        run: |
          wrangler pages deploy . \
            --project-name=gaumatosewa \
            --branch=pr-${{ github.event.number }} \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 💬 Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://pr-${{ github.event.number }}.gaumatosewa.pages.dev`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🌐 Preview Deployment Ready!
            
            | Detail | Value |
            |--------|-------|
            | **Preview URL** | ${previewUrl} |
            | **Commit** | \`${{ github.sha }}\` |
            | **Branch** | ${{ github.head_ref }} |
            | **Triggered by** | @${{ github.actor }} |
            
            ---
            *This preview will be updated on every push to this PR.*`
            });

  # ===========================================================================
  # JOB 3: Health Check (Post-Deployment)
  # ===========================================================================
  health-check:
    name: ❤️ Health Check
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    
    steps:
      - name: 🏥 Check Production URL
        run: |
          echo "Checking production deployment..."
          
          # Try to fetch the main page (retry up to 3 times)
          for i in {1..3}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gaumatosewa.pages.dev || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ Site is live! HTTP Status: $HTTP_STATUS"
              exit 0
            fi
            
            echo "Attempt $i: Received HTTP $HTTP_STATUS, retrying in 10s..."
            sleep 10
          done
          
          echo "⚠️ Could not verify site status, but deployment likely succeeded"
          exit 0  # Don't fail the workflow even if check fails

      - name: 📊 Update Deployment Status
        if: always()
        run: |
          echo "## ❤️ Deployment Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Production URL** | [gaumatosewa.pages.dev](https://gaumatosewa.pages.dev) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
