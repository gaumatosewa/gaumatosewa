# =============================================================================
# Cloudflare Pages Configuration
# Project: gaumatosewa (GreenEarth Organics)
# =============================================================================
#
# 📝 DEPLOYMENT METHOD:
# - Production: Automatic via GitHub Actions (push to main)
# - Preview: Automatic via GitHub Actions (pull requests)
# - Manual: wrangler pages deploy . --project-name=gaumatosewa
#
# ⚠️ ENVIRONMENT VARIABLES:
# These are used by /functions/api/config.js to serve dynamic config.
# For sensitive values, use Cloudflare Dashboard → Pages → Settings → Environment Variables.
# =============================================================================

name = "gaumatosewa"
pages_build_output_dir = "."  # Static site, no build step needed
compatibility_date = "2024-01-01"

# =============================================================================
# Production Environment Variables
# Used when deploying to production (main branch)
# =============================================================================
[vars]
# Site Identity
SITE_NAME = "VedaBotanica Research and Development"
SITE_TAGLINE = "Your trusted source for premium organic gau products, bio-fertilizers, and medicinal herbs. Sourced sustainably, delivered with care."
SITE_COPYRIGHT = "© 2025 GreenEarth Organics. All rights reserved. Made with ❤️ for the planet"

# Contact Information
CONTACT_EMAIL = "info@greenearth.com"
CONTACT_PHONE = "+977-9800000000"

# Location (Kathmandu, Nepal)
ADDRESS_CITY = "Kathmandu"
ADDRESS_PROVINCE = "Bagmati"
ADDRESS_COUNTRY = "Nepal"

# Currency Settings
DEFAULT_CURRENCY = "USD"
EXCHANGE_RATE_TO_NPR = "133.50"

# =============================================================================
# Preview Environment (for pull requests)
# Overrides production values for testing
# =============================================================================
[env.preview]
name = "gaumatosewa-preview"

[env.preview.vars]
SITE_NAME = "VedaBotanica Research and Development [PREVIEW]"
DEFAULT_CURRENCY = "USD"

# =============================================================================
# Deployment Triggers (Reference)
# =============================================================================
# 
# GitHub Actions Workflow: .github/workflows/deploy.yml
# 
# Trigger Matrix:
# ┌─────────────────────┬──────────────────┬─────────────────┐
# │ Event               │ Branch           │ Action          │
# ├─────────────────────┼──────────────────┼─────────────────┤
# │ push                │ main             │ Deploy Prod     │
# │ pull_request        │ feature/*        │ Deploy Preview  │
# │ workflow_dispatch   │ any              │ Manual Deploy   │
# └─────────────────────┴──────────────────┴─────────────────┘
#
# =============================================================================
